name: governance

# Architecture Review governance gate (P1.9, closes #790).
#
# Runs scripts/lint-all.sh — the single gate that bundles, in order:
#   * schema + arch tests           (BLOCKING)
#   * scripts/lint-manifests.py     (BLOCKING)
#   * scripts/lint-duplication.py   (report-only)
#   * scripts/lint-relationships.py (reporting-only-for-now — tracked P2 backlog)
# The job fails iff a BLOCKING step fails; the report-only steps never fail it.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  governance:
    name: governance gate (schemas + linters)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linter dependencies
        run: pip install pyyaml jsonschema

      - name: Run the governance gate
        run: scripts/lint-all.sh
